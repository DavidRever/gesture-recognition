<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Gestos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 1024px;
      height: 576px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Efecto espejo */
    }
  </style>

  <!-- MediaPipe Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <!-- Canvas de dibujo permanente -->
    <canvas id="paint_canvas" width="1024" height="576"></canvas>
    <!-- Canvas superior para trazado de manos y cajas -->
    <canvas id="output_canvas" width="1024" height="576"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const outputCanvas = document.getElementById('output_canvas');
    const paintCanvas = document.getElementById('paint_canvas');
    const ctx = outputCanvas.getContext('2d');
    const paintCtx = paintCanvas.getContext('2d');

    // Configuración del trazado de dibujo
    paintCtx.lineWidth = 6;
    paintCtx.lineCap = 'round';
    paintCtx.lineJoin = 'round';
    paintCtx.strokeStyle = '#00f0ff';

    let lastPoint = null;
    let openClosedCount = 0;
    let bothHandsState = 'UNKNOWN';
    let lastStateChangeTime = 0;

    // Distancia euclidiana básica 2D entre 2 puntos
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // Comprobar si la mano es una palma abierta (dedos extendidos con respecto a la muñeca)
    function isOpenHand(landmarks) {
      const wrist = landmarks[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let extendedCount = 0;

      for (let i = 0; i < tips.length; i++) {
        if (dist(wrist, landmarks[tips[i]]) > dist(wrist, landmarks[mcps[i]])) {
          extendedCount++;
        }
      }
      return extendedCount >= 3;
    }

    // Comprobar si la mano tiene el índice levantado/señalando
    function isIndexPointing(landmarks) {
      const wrist = landmarks[0];
      const indexTip = landmarks[8];
      const indexMcp = landmarks[5];

      // Índice debe estar extendido lejos de la muñeca
      const indexExtended = dist(wrist, indexTip) > dist(wrist, indexMcp) * 1.2;

      // Los otros 3 dedos (medio, anular, meñique) deben estar flexionados o replegados
      const otherTips = [12, 16, 20];
      const otherMcps = [9, 13, 17];
      let otherFolded = 0;

      for (let i = 0; i < otherTips.length; i++) {
        if (dist(wrist, landmarks[otherTips[i]]) < dist(wrist, landmarks[otherMcps[i]]) * 1.15) {
          otherFolded++;
        }
      }

      return indexExtended && (otherFolded >= 2);
    }

    // Comprobar si la mano está cerrada (puño)
    function isClosedHand(landmarks) {
      const wrist = landmarks[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let foldedCount = 0;

      for (let i = 0; i < tips.length; i++) {
        if (dist(wrist, landmarks[tips[i]]) < dist(wrist, landmarks[mcps[i]]) * 1.1) {
          foldedCount++;
        }
      }
      return foldedCount >= 3;
    }

    function drawBoundingBox(landmarks, color) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;

      landmarks.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      });

      const x = minX * outputCanvas.width;
      const y = minY * outputCanvas.height;
      const w = (maxX - minX) * outputCanvas.width;
      const h = (maxY - minY) * outputCanvas.height;

      // Caja principal alrededor de la mano
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // Cajas pequeñas en las puntas de los dedos
      const fingerTips = [4, 8, 12, 16, 20];
      fingerTips.forEach(tipIdx => {
        const tipX = landmarks[tipIdx].x * outputCanvas.width;
        const tipY = landmarks[tipIdx].y * outputCanvas.height;
        const boxSize = 10;

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(tipX - boxSize / 2, tipY - boxSize / 2, boxSize, boxSize);
      });
    }

    function onResults(results) {
      ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
      ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

      const hands = results.multiHandLandmarks;

      if (!hands || hands.length === 0) {
        lastPoint = null;
        return;
      }

      // 1. Detección del gesto de Borrado con 2 Manos
      if (hands.length === 2) {
        const h1Open = isOpenHand(hands[0]);
        const h2Open = isOpenHand(hands[1]);
        const h1Closed = isClosedHand(hands[0]);
        const h2Closed = isClosedHand(hands[1]);

        let currentState = 'OTHER';
        if (h1Open && h2Open) currentState = 'BOTH_OPEN';
        else if (h1Closed && h2Closed) currentState = 'BOTH_CLOSED';

        const now = Date.now();
        if (currentState !== bothHandsState && (now - lastStateChangeTime) > 180) {
          if ((bothHandsState === 'BOTH_OPEN' && currentState === 'BOTH_CLOSED') ||
              (bothHandsState === 'BOTH_CLOSED' && currentState === 'BOTH_OPEN')) {
            openClosedCount += 0.5;
          }
          bothHandsState = currentState;
          lastStateChangeTime = now;

          if (openClosedCount >= 2) {
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            openClosedCount = 0;
          }
        }
      }

      // 2. Detección del gesto de Dibujo (1 Palma + 1 Índice)
      if (hands.length === 2) {
        let pointerHand = null;
        let canvasHand = null;

        if (isOpenHand(hands[0]) && isIndexPointing(hands[1])) {
          canvasHand = hands[0];
          pointerHand = hands[1];
        } else if (isOpenHand(hands[1]) && isIndexPointing(hands[0])) {
          canvasHand = hands[1];
          pointerHand = hands[0];
        }

        drawBoundingBox(hands[0], '#38bdf8');
        drawBoundingBox(hands[1], '#38bdf8');

        if (pointerHand && canvasHand) {
          const indexTip = pointerHand[8];
          const currX = indexTip.x * paintCanvas.width;
          const currY = indexTip.y * paintCanvas.height;

          // Dibujar punto/pincel guía sobre la punta del índice
          ctx.beginPath();
          ctx.arc(currX, currY, 8, 0, 2 * Math.PI);
          ctx.fillStyle = '#00f0ff';
          ctx.fill();

          if (lastPoint) {
            paintCtx.beginPath();
            paintCtx.moveTo(lastPoint.x, lastPoint.y);
            paintCtx.lineTo(currX, currY);
            paintCtx.stroke();
          }
          lastPoint = { x: currX, y: currY };
        } else {
          lastPoint = null;
        }
      } else {
        // Si solo hay 1 mano presente
        drawBoundingBox(hands[0], '#22c55e');
        lastPoint = null;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1024,
      height: 576
    });

    camera.start();
  </script>
</body>
</html>
