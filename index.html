<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Gestos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 1024px;
      height: 576px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Modo espejo */
    }
  </style>

  <!-- MediaPipe Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <!-- Capa 1: Dibujo acumulado -->
    <canvas id="paint_canvas" width="1024" height="576"></canvas>
    <!-- Capa 2: Cámara y cajas -->
    <canvas id="output_canvas" width="1024" height="576"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const outputCanvas = document.getElementById('output_canvas');
    const paintCanvas = document.getElementById('paint_canvas');
    const ctx = outputCanvas.getContext('2d');
    const paintCtx = paintCanvas.getContext('2d');

    // Paleta de colores
    const colors = ['#ffd700', '#00f0ff', '#ff3366']; // Dorado, Azul, Rojo
    let colorIndex = 0;

    // Configuración del pincel
    paintCtx.lineWidth = 6;
    paintCtx.lineCap = 'round';
    paintCtx.lineJoin = 'round';
    paintCtx.strokeStyle = colors[colorIndex];

    let lastPoint = null;

    // Variables para el borrado (Abrir/Cerrar manos 2 veces)
    let openClosedCount = 0;
    let bothHandsState = 'NONE';
    let lastStateChangeTime = 0;

    // Variables para el cambio de color por Deslizamiento (Swipe)
    let swipeStartX = null;
    let swipeStartTime = 0;
    let lastSwipeTime = 0;

    // Evalúa si un dedo está estirado (Y de la punta menor a la articulación)
    function isFingerUp(landmarks, tipIdx, pipIdx) {
      return landmarks[tipIdx].y < landmarks[pipIdx].y;
    }

    // Mano Abierta
    function isOpenHand(landmarks) {
      const fingers = [
        isFingerUp(landmarks, 8, 6),   // Índice
        isFingerUp(landmarks, 12, 10), // Medio
        isFingerUp(landmarks, 16, 14), // Anular
        isFingerUp(landmarks, 20, 18)  // Meñique
      ];
      return fingers.filter(Boolean).length >= 3;
    }

    // Mano Cerrada (Puño)
    function isClosedHand(landmarks) {
      const fingers = [
        isFingerUp(landmarks, 8, 6),
        isFingerUp(landmarks, 12, 10),
        isFingerUp(landmarks, 16, 14),
        isFingerUp(landmarks, 20, 18)
      ];
      return fingers.filter(Boolean).length <= 1;
    }

    // Solo Índice Apuntando
    function isIndexPointing(landmarks) {
      const indexUp = isFingerUp(landmarks, 8, 6);
      const middleUp = isFingerUp(landmarks, 12, 10);
      const ringUp = isFingerUp(landmarks, 16, 14);
      const pinkyUp = isFingerUp(landmarks, 20, 18);

      return indexUp && !middleUp && !ringUp && !pinkyUp;
    }

    function drawBoundingBox(landmarks, color) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;

      landmarks.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      });

      const x = minX * outputCanvas.width;
      const y = minY * outputCanvas.height;
      const w = (maxX - minX) * outputCanvas.width;
      const h = (maxY - minY) * outputCanvas.height;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // Cajas pequeñas en los dedos
      const fingerTips = [4, 8, 12, 16, 20];
      fingerTips.forEach(tipIdx => {
        const tipX = landmarks[tipIdx].x * outputCanvas.width;
        const tipY = landmarks[tipIdx].y * outputCanvas.height;
        const boxSize = 10;

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(tipX - boxSize / 2, tipY - boxSize / 2, boxSize, boxSize);
      });
    }

    function onResults(results) {
      ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
      ctx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

      const hands = results.multiHandLandmarks;

      if (!hands || hands.length === 0) {
        lastPoint = null;
        swipeStartX = null;
        return;
      }

      const now = Date.now();

      // -------------------------------------------------------------
      // 1. Gesto de Borrado (2 Manos: Abrir y Cerrar x2)
      // -------------------------------------------------------------
      if (hands.length === 2) {
        const h1Open = isOpenHand(hands[0]);
        const h2Open = isOpenHand(hands[1]);
        const h1Closed = isClosedHand(hands[0]);
        const h2Closed = isClosedHand(hands[1]);

        let currentState = 'NONE';
        if (h1Open && h2Open) currentState = 'OPEN';
        else if (h1Closed && h2Closed) currentState = 'CLOSED';

        if (currentState !== 'NONE' && currentState !== bothHandsState && (now - lastStateChangeTime) > 150) {
          if ((bothHandsState === 'OPEN' && currentState === 'CLOSED') ||
              (bothHandsState === 'CLOSED' && currentState === 'OPEN')) {
            openClosedCount += 0.5;
          }
          bothHandsState = currentState;
          lastStateChangeTime = now;

          if (openClosedCount >= 2) {
            paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
            openClosedCount = 0;
          }
        }
      } else {
        bothHandsState = 'NONE';
      }

      // -------------------------------------------------------------
      // 2. Gesto de Swipe para Cambiar Color (1 Palma Abierta desplazándose)
      // -------------------------------------------------------------
      if (hands.length === 1 && isOpenHand(hands[0])) {
        const wristX = hands[0][0].x; // Coordenada X de la muñeca

        if (swipeStartX === null) {
          swipeStartX = wristX;
          swipeStartTime = now;
        } else {
          const deltaX = wristX - swipeStartX;
          const deltaTime = now - swipeStartTime;

          // Se evalúa un deslizamiento rápido (en menos de 400ms y más de 0.25 de pantalla)
          if (deltaTime < 400 && (now - lastSwipeTime) > 600) {
            // Nota: Por el modo espejo, los ejes X están invertidos
            if (deltaX > 0.25) { 
              // Deslizar a la izquierda visual -> Anterior Color
              colorIndex = (colorIndex - 1 + colors.length) % colors.length;
              paintCtx.strokeStyle = colors[colorIndex];
              lastSwipeTime = now;
              swipeStartX = null;
            } else if (deltaX < -0.25) { 
              // Deslizar a la derecha visual -> Siguiente Color
              colorIndex = (colorIndex + 1) % colors.length;
              paintCtx.strokeStyle = colors[colorIndex];
              lastSwipeTime = now;
              swipeStartX = null;
            }
          }

          if (deltaTime >= 400) {
            swipeStartX = wristX;
            swipeStartTime = now;
          }
        }
      } else {
        swipeStartX = null;
      }

      // -------------------------------------------------------------
      // 3. Modo Dibujo (1 Palma Abierta + 1 Dedo Índice)
      // -------------------------------------------------------------
      if (hands.length === 2) {
        let pointerHand = null;
        let canvasHand = null;

        if (isOpenHand(hands[0]) && isIndexPointing(hands[1])) {
          canvasHand = hands[0];
          pointerHand = hands[1];
        } else if (isOpenHand(hands[1]) && isIndexPointing(hands[0])) {
          canvasHand = hands[1];
          pointerHand = hands[0];
        }

        drawBoundingBox(hands[0], colors[colorIndex]);
        drawBoundingBox(hands[1], colors[colorIndex]);

        if (pointerHand && canvasHand) {
          const indexTip = pointerHand[8];
          const currX = indexTip.x * paintCanvas.width;
          const currY = indexTip.y * paintCanvas.height;

          // Puntero visible en el color seleccionado
          ctx.beginPath();
          ctx.arc(currX, currY, 7, 0, 2 * Math.PI);
          ctx.fillStyle = colors[colorIndex];
          ctx.fill();

          if (lastPoint) {
            paintCtx.beginPath();
            paintCtx.moveTo(lastPoint.x, lastPoint.y);
            paintCtx.lineTo(currX, currY);
            paintCtx.stroke();
          }
          lastPoint = { x: currX, y: currY };
        } else {
          lastPoint = null;
        }
      } else {
        drawBoundingBox(hands[0], '#22c55e');
        lastPoint = null;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1024,
      height: 576
    });

    camera.start();
  </script>
</body>
</html>
