<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spatial Canvas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;

      width: min(1024px, 95vw);
      aspect-ratio: 16 / 9;

      border-radius: 20px;
      overflow: hidden;

      background: #000;

      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.8),
        0 0 100px rgba(0, 240, 255, 0.08);
    }

    canvas {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      transform: scaleX(-1);
    }

    /*
      El canvas de dibujo está ARRIBA de la cámara.
      De esta manera el dibujo nunca queda oculto.
    */
    #paint_canvas {
      z-index: 2;
      pointer-events: none;
    }

    #output_canvas {
      z-index: 1;
    }

    video {
      display: none;
    }

    .info {
      position: absolute;

      left: 20px;
      top: 20px;

      z-index: 10;

      color: white;

      background: rgba(0, 0, 0, 0.45);

      padding: 10px 14px;

      border-radius: 12px;

      backdrop-filter: blur(8px);

      font-size: 13px;

      pointer-events: none;
    }

    .status {
      color: #00f0ff;
      font-weight: bold;
    }
  </style>

  <!-- MediaPipe -->
  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    crossorigin="anonymous">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    crossorigin="anonymous">
  </script>

</head>

<body>

  <div class="container">

    <video
      id="webcam"
      autoplay
      playsinline>
    </video>

    <!-- Cámara + detección -->
    <canvas
      id="output_canvas"
      width="1024"
      height="576">
    </canvas>

    <!-- Dibujo permanente -->
    <canvas
      id="paint_canvas"
      width="1024"
      height="576">
    </canvas>

    <div class="info">
      <span class="status" id="status">
        Iniciando cámara...
      </span>
    </div>

  </div>


  <script>

    // ============================================================
    // ELEMENTOS
    // ============================================================

    const videoElement = document.getElementById("webcam");

    const outputCanvas =
      document.getElementById("output_canvas");

    const paintCanvas =
      document.getElementById("paint_canvas");

    const statusElement =
      document.getElementById("status");

    const ctx =
      outputCanvas.getContext("2d");

    const paintCtx =
      paintCanvas.getContext("2d");


    // ============================================================
    // CONFIGURACIÓN
    // ============================================================

    const WIDTH = 1024;
    const HEIGHT = 576;

    outputCanvas.width = WIDTH;
    outputCanvas.height = HEIGHT;

    paintCanvas.width = WIDTH;
    paintCanvas.height = HEIGHT;


    // ============================================================
    // CONFIGURACIÓN DEL PINCEL
    // ============================================================

    paintCtx.lineWidth = 7;

    paintCtx.lineCap = "round";
    paintCtx.lineJoin = "round";

    paintCtx.strokeStyle = "#00f0ff";


    // ============================================================
    // ESTADO
    // ============================================================

    let lastPoint = null;

    let smoothedPoint = null;

    let drawing = false;

    let lastDetectionTime = 0;

    let clearGestureStart = null;

    let clearCooldown = false;


    // ============================================================
    // UTILIDADES
    // ============================================================

    function distance(a, b) {

      const dx = a.x - b.x;
      const dy = a.y - b.y;

      return Math.sqrt(dx * dx + dy * dy);
    }


    // ============================================================
    // DETECCIÓN DE DEDOS
    // ============================================================

    function isFingerUp(landmarks, tip, pip) {

      return landmarks[tip].y < landmarks[pip].y;
    }


    function isIndexUp(landmarks) {

      return isFingerUp(
        landmarks,
        8,
        6
      );
    }


    function isMiddleUp(landmarks) {

      return isFingerUp(
        landmarks,
        12,
        10
      );
    }


    function isRingUp(landmarks) {

      return isFingerUp(
        landmarks,
        16,
        14
      );
    }


    function isPinkyUp(landmarks) {

      return isFingerUp(
        landmarks,
        20,
        18
      );
    }


    // ============================================================
    // MANO APUNTANDO
    // ============================================================

    function isIndexPointing(landmarks) {

      const index = isIndexUp(landmarks);

      const middle = isMiddleUp(landmarks);

      const ring = isRingUp(landmarks);

      const pinky = isPinkyUp(landmarks);

      return (
        index &&
        !middle &&
        !ring &&
        !pinky
      );
    }


    // ============================================================
    // MANO ABIERTA
    // ============================================================

    function isOpenHand(landmarks) {

      const fingers = [

        isIndexUp(landmarks),

        isMiddleUp(landmarks),

        isRingUp(landmarks),

        isPinkyUp(landmarks)

      ];

      return (
        fingers.filter(Boolean).length >= 3
      );
    }


    // ============================================================
    // MANO CERRADA
    // ============================================================

    function isClosedHand(landmarks) {

      const fingers = [

        isIndexUp(landmarks),

        isMiddleUp(landmarks),

        isRingUp(landmarks),

        isPinkyUp(landmarks)

      ];

      return (
        fingers.filter(Boolean).length <= 1
      );
    }


    // ============================================================
    // SUAVIZADO DEL CURSOR
    // ============================================================

    function smoothPoint(point) {

      if (!smoothedPoint) {

        smoothedPoint = {
          x: point.x,
          y: point.y
        };

        return smoothedPoint;
      }

      /*
        0.35 = bastante suave
        0.50 = más rápido
        0.20 = muy suave
      */

      const smoothing = 0.35;

      smoothedPoint.x +=
        (point.x - smoothedPoint.x)
        * smoothing;

      smoothedPoint.y +=
        (point.y - smoothedPoint.y)
        * smoothing;

      return smoothedPoint;
    }


    // ============================================================
    // DIBUJAR PUNTO DEL ÍNDICE
    // ============================================================

    function drawCursor(x, y) {

      ctx.save();

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        drawing ? 9 : 7,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        drawing
          ? "#00f0ff"
          : "#ffffff";

      ctx.shadowBlur = 20;

      ctx.shadowColor = "#00f0ff";

      ctx.fill();

      ctx.restore();
    }


    // ============================================================
    // DIBUJAR MANO
    // ============================================================

    function drawHand(landmarks, color) {

      let minX = 1;
      let minY = 1;

      let maxX = 0;
      let maxY = 0;


      landmarks.forEach(point => {

        minX = Math.min(minX, point.x);
        minY = Math.min(minY, point.y);

        maxX = Math.max(maxX, point.x);
        maxY = Math.max(maxY, point.y);

      });


      const x =
        minX * WIDTH;

      const y =
        minY * HEIGHT;

      const w =
        (maxX - minX) * WIDTH;

      const h =
        (maxY - minY) * HEIGHT;


      // Bounding box

      ctx.save();

      ctx.strokeStyle = color;

      ctx.lineWidth = 2;

      ctx.globalAlpha = 0.7;

      ctx.strokeRect(
        x,
        y,
        w,
        h
      );


      // Puntas de dedos

      const tips = [
        4,
        8,
        12,
        16,
        20
      ];


      tips.forEach(index => {

        const px =
          landmarks[index].x * WIDTH;

        const py =
          landmarks[index].y * HEIGHT;

        const size = 8;

        ctx.strokeStyle = "#ffffff";

        ctx.lineWidth = 1.5;

        ctx.strokeRect(
          px - size / 2,
          py - size / 2,
          size,
          size
        );

      });


      ctx.restore();
    }


    // ============================================================
    // DIBUJAR TRAZO
    // ============================================================

    function drawStroke(x, y) {

      if (!lastPoint) {

        lastPoint = {
          x,
          y
        };

        return;
      }


      const distanceMoved =
        distance(
          lastPoint,
          {
            x,
            y
          }
        );


      /*
        Ignoramos movimientos microscópicos
        para reducir ruido.
      */

      if (distanceMoved < 1.5) {
        return;
      }


      paintCtx.beginPath();

      paintCtx.moveTo(
        lastPoint.x,
        lastPoint.y
      );

      paintCtx.lineTo(
        x,
        y
      );

      paintCtx.stroke();


      lastPoint = {
        x,
        y
      };
    }


    // ============================================================
    // BORRAR TODO
    // ============================================================

    function clearCanvas() {

      paintCtx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );

      lastPoint = null;

      smoothedPoint = null;

      statusElement.textContent =
        "Lienzo borrado";
    }


    // ============================================================
    // DETECTAR GESTO DE BORRADO
    // ============================================================

    function detectClearGesture(hands) {

      if (hands.length !== 2) {

        clearGestureStart = null;

        return;
      }


      const bothOpen =
        isOpenHand(hands[0]) &&
        isOpenHand(hands[1]);


      const bothClosed =
        isClosedHand(hands[0]) &&
        isClosedHand(hands[1]);


      /*
        Guardamos una secuencia:

        ABIERTA
           ↓
        CERRADA
           ↓
        ABIERTA
           ↓
        CERRADA

        Para evitar falsos positivos.
      */

      if (!clearGestureStart) {

        if (bothOpen) {

          clearGestureStart = {
            state: "OPEN",
            time: Date.now()
          };

        }

        return;
      }


      const currentState =
        bothOpen
          ? "OPEN"
          : bothClosed
            ? "CLOSED"
            : null;


      if (!currentState) {
        return;
      }


      if (
        currentState !==
        clearGestureStart.state
      ) {

        clearGestureStart = {
          state: currentState,
          time: Date.now()
        };

        /*
          Si pasamos de OPEN a CLOSED
          esperamos que vuelva a OPEN
          y luego CLOSED.
        */

        if (
          currentState === "CLOSED" &&
          !clearCooldown
        ) {

          clearCooldown = true;

          setTimeout(() => {

            clearCooldown = false;

          }, 600);

        }
      }
    }


    // ============================================================
    // RESULTADOS DE MEDIAPIPE
    // ============================================================

    function onResults(results) {

      // ----------------------------------------------------------
      // LIMPIAR OUTPUT
      // ----------------------------------------------------------

      ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      // ----------------------------------------------------------
      // DIBUJAR CÁMARA
      // ----------------------------------------------------------

      ctx.drawImage(
        results.image,
        0,
        0,
        WIDTH,
        HEIGHT
      );


      const hands =
        results.multiHandLandmarks;


      // ----------------------------------------------------------
      // SIN MANOS
      // ----------------------------------------------------------

      if (
        !hands ||
        hands.length === 0
      ) {

        /*
          No eliminamos inmediatamente el punto.

          Esto evita que una pequeña pérdida
          de tracking corte el dibujo.
        */

        if (
          Date.now() - lastDetectionTime > 120
        ) {

          drawing = false;

          lastPoint = null;

          smoothedPoint = null;

        }


        statusElement.textContent =
          "Muestra tu mano";

        return;
      }


      lastDetectionTime =
        Date.now();


      // ----------------------------------------------------------
      // GESTO DE BORRADO
      // ----------------------------------------------------------

      detectClearGesture(hands);


      // ----------------------------------------------------------
      // DIBUJAR BOUNDING BOXES
      // ----------------------------------------------------------

      hands.forEach(hand => {

        const pointing =
          isIndexPointing(hand);

        drawHand(
          hand,
          pointing
            ? "#00f0ff"
            : "#22c55e"
        );

      });


      // ----------------------------------------------------------
      // BUSCAR MANO QUE ESTÁ APUNTANDO
      // ----------------------------------------------------------

      let pointerHand = null;


      for (
        let i = 0;
        i < hands.length;
        i++
      ) {

        if (
          isIndexPointing(
            hands[i]
          )
        ) {

          pointerHand =
            hands[i];

          break;
        }

      }


      // ----------------------------------------------------------
      // SI HAY ÍNDICE
      // ----------------------------------------------------------

      if (pointerHand) {

        const indexTip =
          pointerHand[8];


        // Coordenadas del canvas

        const rawX =
          indexTip.x * WIDTH;

        const rawY =
          indexTip.y * HEIGHT;


        // Suavizamos

        const point =
          smoothPoint({
            x: rawX,
            y: rawY
          });


        // ------------------------------------------------------
        // CURSOR
        // ------------------------------------------------------

        drawCursor(
          point.x,
          point.y
        );


        // ------------------------------------------------------
        // DIBUJAR
        // ------------------------------------------------------

        drawing = true;

        drawStroke(
          point.x,
          point.y
        );


        statusElement.textContent =
          "✦ Dibujando";

      } else {

        /*
          Cuando el usuario deja de apuntar,
          terminamos el trazo.

          El próximo movimiento comenzará
          una línea nueva.
        */

        drawing = false;

        lastPoint = null;

        smoothedPoint = null;


        statusElement.textContent =
          "Levanta solo el índice";

      }
    }


    // ============================================================
    // MEDIAPIPE HANDS
    // ============================================================

    const hands =
      new Hands({

        locateFile: file => {

          return (
            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
            + file
          );

        }

      });


    hands.setOptions({

      maxNumHands: 2,

      modelComplexity: 1,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });


    hands.onResults(
      onResults
    );


    // ============================================================
    // CÁMARA
    // ============================================================

    const camera =
      new Camera(
        videoElement,
        {

          onFrame: async () => {

            await hands.send({
              image: videoElement
            });

          },

          width: WIDTH,

          height: HEIGHT

        }
      );


    camera.start();


    // ============================================================
    // MENSAJE INICIAL
    // ============================================================

    statusElement.textContent =
      "Muestra tu mano";

  </script>

</body>
</html>
