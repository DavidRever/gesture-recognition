<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Canvas</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050505;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .container {
    position: relative;
    width: min(1024px, 95vw);
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    box-shadow:
      0 0 40px rgba(0, 0, 0, 0.8),
      0 0 100px rgba(0, 240, 255, 0.08);
  }

  .container:fullscreen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }

  /* El dibujo queda por encima de la cámara */
  #output_canvas { z-index: 1; }
  #paint_canvas { z-index: 2; pointer-events: none; }

  video { display: none; }

  /* Indicador visual del color activo */
  .color-indicator {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    opacity: 0;
    z-index: 20;
    pointer-events: none;
    box-shadow: 0 0 15px currentColor, 0 0 35px currentColor;
    transition: opacity 0.2s, transform 0.25s;
  }

  .color-indicator.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  /* Botón de pantalla completa */
  .fullscreen-btn {
    position: absolute;
    bottom: 18px;
    right: 18px;
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(0, 240, 255, 0.4);
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
  }

  .fullscreen-btn:hover {
    border-color: rgba(0, 240, 255, 0.9);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
    background: rgba(0, 0, 0, 0.65);
  }

  .fullscreen-btn svg {
    width: 18px;
    height: 18px;
    stroke: #e6feff;
  }
</style>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="container" id="container">

    <video id="webcam" autoplay playsinline></video>

    <!-- Cámara + detección -->
    <canvas id="output_canvas" width="1024" height="576"></canvas>

    <!-- Dibujo permanente -->
    <canvas id="paint_canvas" width="1024" height="576"></canvas>

    <!-- Indicador de color -->
    <div id="colorIndicator" class="color-indicator"></div>

    <!-- Botón de pantalla completa -->
    <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Pantalla completa" title="Pantalla completa">
      <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
    </button>

  </div>

  <script>

    // ============================================================
    // ELEMENTOS
    // ============================================================
    const videoElement = document.getElementById("webcam");
    const outputCanvas = document.getElementById("output_canvas");
    const paintCanvas = document.getElementById("paint_canvas");
    const ctx = outputCanvas.getContext("2d");
    const paintCtx = paintCanvas.getContext("2d");
    const colorIndicator = document.getElementById("colorIndicator");
    const container = document.getElementById("container");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const fsIcon = document.getElementById("fsIcon");

    const WIDTH = 1024;
    const HEIGHT = 576;

    // ============================================================
    // PANTALLA COMPLETA
    // ============================================================
    const EXPAND_PATH = `
      <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
      <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
      <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
    `;

    const COLLAPSE_PATH = `
      <path d="M9 3v3a2 2 0 0 1-2 2H4"></path>
      <path d="M15 3v3a2 2 0 0 0 2 2h3"></path>
      <path d="M9 21v-3a2 2 0 0 0-2-2H4"></path>
      <path d="M15 21v-3a2 2 0 0 1 2-2h3"></path>
    `;

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFsIcon() {
      fsIcon.innerHTML = isFullscreen() ? COLLAPSE_PATH : EXPAND_PATH;
    }

    fullscreenBtn.addEventListener("click", () => {
      if (!isFullscreen()) {
        (container.requestFullscreen || container.webkitRequestFullscreen)?.call(container);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    });

    document.addEventListener("fullscreenchange", updateFsIcon);
    document.addEventListener("webkitfullscreenchange", updateFsIcon);

    // ============================================================
    // COLORES DEL PINCEL
    // ============================================================
    const colors = [
      "#FFD700", // Dorado
      "#008CFF", // Azul
      "#FF3030"  // Rojo
    ];

    let currentColorIndex = 0;

    function getCurrentColor() {
      return colors[currentColorIndex];
    }

    function nextColor() {
      currentColorIndex = (currentColorIndex + 1) % colors.length;
      paintCtx.strokeStyle = getCurrentColor();
      showColorIndicator();
    }

    let indicatorTimeout;

    function showColorIndicator() {
      const color = getCurrentColor();
      colorIndicator.style.background = color;
      colorIndicator.style.color = color;
      colorIndicator.classList.add("show");

      clearTimeout(indicatorTimeout);
      indicatorTimeout = setTimeout(() => {
        colorIndicator.classList.remove("show");
      }, 700);
    }

    // ============================================================
    // CONFIGURACIÓN DEL PINCEL
    // ============================================================
    paintCtx.lineWidth = 7;
    paintCtx.lineCap = "round";
    paintCtx.lineJoin = "round";
    paintCtx.strokeStyle = getCurrentColor();

    // ============================================================
    // ESTADO DEL DIBUJO (uno por mano, para dibujar con ambas a la vez)
    // ============================================================
    const handStates = {};

    function getHandState(key) {
      if (!handStates[key]) {
        handStates[key] = { lastPoint: null, smoothedPoint: null };
      }
      return handStates[key];
    }

    function resetHandState(key) {
      if (handStates[key]) {
        handStates[key].lastPoint = null;
        handStates[key].smoothedPoint = null;
      }
    }

    // ============================================================
    // ESTADO DEL PELLIZCO (cambio de color)
    // ============================================================
    let pinchActive = false;
    const PINCH_CLOSE_RATIO = 0.22;
    const PINCH_OPEN_RATIO = 0.60;

    // ============================================================
    // GOMA
    // ============================================================
    const ERASER_RADIUS = 35;

    // ============================================================
    // UTILIDADES GEOMÉTRICAS
    // ============================================================
    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    const EXTEND_ANGLE = 150; // grados; por encima = dedo extendido
    const FOLD_ANGLE = 140;   // grados; por debajo = dedo doblado

    // Ángulo en el nudillo medio (pip) entre el segmento hacia la base (mcp)
    // y el segmento hacia la punta (tip). ~180° = dedo recto, valores bajos
    // = dedo doblado. Al depender solo de los 3 puntos del propio dedo,
    // funciona igual de frente, de lado o de espaldas a la cámara.
    function fingerAngle(landmarks, mcp, pip, tip) {
      const a = {
        x: landmarks[mcp].x - landmarks[pip].x,
        y: landmarks[mcp].y - landmarks[pip].y,
        z: (landmarks[mcp].z || 0) - (landmarks[pip].z || 0)
      };
      const b = {
        x: landmarks[tip].x - landmarks[pip].x,
        y: landmarks[tip].y - landmarks[pip].y,
        z: (landmarks[tip].z || 0) - (landmarks[pip].z || 0)
      };

      const dot = a.x * b.x + a.y * b.y + a.z * b.z;
      const magA = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z) || 1e-6;
      const magB = Math.sqrt(b.x * b.x + b.y * b.y + b.z * b.z) || 1e-6;
      const cos = Math.min(1, Math.max(-1, dot / (magA * magB)));

      return (Math.acos(cos) * 180) / Math.PI;
    }

    function isFingerUp(landmarks, mcp, pip, tip) {
      return fingerAngle(landmarks, mcp, pip, tip) > EXTEND_ANGLE;
    }

    function isFingerFolded(landmarks, mcp, pip, tip) {
      return fingerAngle(landmarks, mcp, pip, tip) < FOLD_ANGLE;
    }

    function isIndexUp(landmarks) { return isFingerUp(landmarks, 5, 6, 8); }
    function isMiddleUp(landmarks) { return isFingerUp(landmarks, 9, 10, 12); }
    function isRingUp(landmarks) { return isFingerUp(landmarks, 13, 14, 16); }
    function isPinkyUp(landmarks) { return isFingerUp(landmarks, 17, 18, 20); }

    function isIndexPointing(landmarks) {
      return (
        isIndexUp(landmarks) &&
        !isMiddleUp(landmarks) &&
        !isRingUp(landmarks) &&
        !isPinkyUp(landmarks)
      );
    }

    // Puño: los 4 dedos doblados, sin importar la orientación de la mano
    function isClosedHand(landmarks) {
      return (
        isFingerFolded(landmarks, 5, 6, 8) &&
        isFingerFolded(landmarks, 9, 10, 12) &&
        isFingerFolded(landmarks, 13, 14, 16) &&
        isFingerFolded(landmarks, 17, 18, 20)
      );
    }


    // Distancia pulgar-meñique normalizada por el tamaño de la mano
    function pinchRatio(landmarks) {
      const handSize = distance(landmarks[0], landmarks[9]) || 1;
      const pinchDist = distance(landmarks[4], landmarks[20]);
      return pinchDist / handSize;
    }

    // ============================================================
    // SUAVIZADO DEL ÍNDICE
    // ============================================================
    function smoothPoint(state, point) {
      if (!state.smoothedPoint) {
        state.smoothedPoint = { x: point.x, y: point.y };
        return state.smoothedPoint;
      }
      const smoothing = 0.35;
      state.smoothedPoint.x += (point.x - state.smoothedPoint.x) * smoothing;
      state.smoothedPoint.y += (point.y - state.smoothedPoint.y) * smoothing;
      return state.smoothedPoint;
    }

    // ============================================================
    // DIBUJO DE OVERLAYS (estética "tecnológica")
    // ============================================================
    function drawCursor(x, y, color) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowBlur = 20;
      ctx.shadowColor = color;
      ctx.fill();
      ctx.restore();
    }

    function drawEraserCursor(x, y) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, ERASER_RADIUS, 0, Math.PI * 2);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }

    function drawHand(landmarks, color) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;

      landmarks.forEach(point => {
        minX = Math.min(minX, point.x);
        minY = Math.min(minY, point.y);
        maxX = Math.max(maxX, point.x);
        maxY = Math.max(maxY, point.y);
      });

      const x = minX * WIDTH;
      const y = minY * HEIGHT;
      const w = (maxX - minX) * WIDTH;
      const h = (maxY - minY) * HEIGHT;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.55;
      ctx.strokeRect(x, y, w, h);
      ctx.restore();

      // Marca en la punta de cada dedo; el índice usa el color actual
      const fingertips = [4, 8, 12, 16, 20];

      fingertips.forEach(id => {
        const tip = landmarks[id];
        const tipX = tip.x * WIDTH;
        const tipY = tip.y * HEIGHT;
        const isIndexTip = id === 8;

        ctx.save();
        ctx.strokeStyle = isIndexTip ? getCurrentColor() : "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.85;
        if (isIndexTip) {
          ctx.shadowBlur = 10;
          ctx.shadowColor = getCurrentColor();
        }
        ctx.strokeRect(tipX - 5, tipY - 5, 10, 10);
        ctx.restore();
      });
    }

    // ============================================================
    // DIBUJAR TRAZO
    // ============================================================
    function drawStroke(state, x, y) {
      if (!state.lastPoint) {
        state.lastPoint = { x, y };
        return;
      }

      const currentPoint = { x, y };
      const movement = distance(state.lastPoint, currentPoint);

      if (movement < 1.5) return;

      paintCtx.beginPath();
      paintCtx.moveTo(state.lastPoint.x, state.lastPoint.y);
      paintCtx.lineTo(currentPoint.x, currentPoint.y);
      paintCtx.stroke();

      state.lastPoint = currentPoint;
    }

    // ============================================================
    // BORRAR CON GOMA
    // ============================================================
    function eraseAt(x, y) {
      paintCtx.save();
      paintCtx.globalCompositeOperation = "destination-out";
      paintCtx.beginPath();
      paintCtx.arc(x, y, ERASER_RADIUS, 0, Math.PI * 2);
      paintCtx.fill();
      paintCtx.restore();
      paintCtx.globalCompositeOperation = "source-over";
    }

    // ============================================================
    // PELLIZCO → CAMBIO DE COLOR
    // ============================================================
    // El pellizco solo cuenta con índice, medio y anular arriba
    function canPinch(landmarks) {
      return isIndexUp(landmarks) && isMiddleUp(landmarks) && isRingUp(landmarks);
    }

    // ============================================================
    // RESULTADOS DE MEDIAPIPE
    // ============================================================
    function onResults(results) {

      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.drawImage(results.image, 0, 0, WIDTH, HEIGHT);

      const hands = results.multiHandLandmarks;
      const handedness = results.multiHandedness || [];

      if (!hands || hands.length === 0) {
        Object.keys(handStates).forEach(resetHandState);
        pinchActive = false;
        return;
      }

      // Identidad estable de cada mano entre frames (para no mezclar trazos)
      const presentKeys = new Set();

      // Cambio de color: solo cuentan las manos con índice+medio+anular arriba
      let minRatio = Infinity;
      hands.forEach(hand => {
        if (canPinch(hand)) {
          minRatio = Math.min(minRatio, pinchRatio(hand));
        }
      });

      if (minRatio < PINCH_CLOSE_RATIO && !pinchActive) {
        pinchActive = true;
        nextColor();
      } else if (minRatio > PINCH_OPEN_RATIO && pinchActive) {
        pinchActive = false;
      }

      hands.forEach((hand, i) => {
        const key = handedness[i]?.label || `hand_${i}`;
        presentKeys.add(key);

        const colorGesture = canPinch(hand);
        const pointing = isIndexPointing(hand);
        const closed = isClosedHand(hand);

        // Overlay de detección
        let overlayColor = "#22c55e";
        if (colorGesture) overlayColor = getCurrentColor();
        else if (pointing) overlayColor = getCurrentColor();
        else if (closed) overlayColor = "#ffffff";
        drawHand(hand, overlayColor);

        // El gesto de cambio de color no dibuja ni borra
        if (colorGesture) {
          resetHandState(key);
          return;
        }

        // BORRAR CON PUÑO
        if (closed) {
          resetHandState(key);

          const indexTip = hand[8];
          const x = indexTip.x * WIDTH;
          const y = indexTip.y * HEIGHT;

          eraseAt(x, y);
          drawEraserCursor(x, y);
          return;
        }

        // DIBUJAR CON ÍNDICE
        if (pointing) {
          const state = getHandState(key);
          const indexTip = hand[8];
          const rawX = indexTip.x * WIDTH;
          const rawY = indexTip.y * HEIGHT;

          const point = smoothPoint(state, { x: rawX, y: rawY });

          drawCursor(point.x, point.y, getCurrentColor());
          drawStroke(state, point.x, point.y);
          return;
        }

        // NINGÚN GESTO ACTIVO EN ESTA MANO
        resetHandState(key);
      });

      // Limpiar el estado de manos que salieron de cuadro este frame
      Object.keys(handStates).forEach(key => {
        if (!presentKeys.has(key)) resetHandState(key);
      });
    }

    // ============================================================
    // MEDIAPIPE
    // ============================================================
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    // ============================================================
    // CÁMARA
    // ============================================================
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: WIDTH,
      height: HEIGHT
    });

    camera.start();

  </script>

</body>
</html>
